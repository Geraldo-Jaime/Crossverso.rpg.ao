<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrosVerso</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ESTILO ESPECÍFICO DESTA PÁGINA */
        body {
            background-color: #ffffff !important; /* Força o BRANCO */
            color: #000000 !important;            /* Texto PRETO */
            margin: 0;
        }
        .app-header {
            background-color: #000000; /* Header continua preto */
            color: #ffffff;
            border-bottom: none;
            position: fixed; /* Fixa o header no topo */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
        
        /* Ajuste para o conteúdo não ficar escondido atrás do header fixo */
        .main-content {
            margin-top: 120px; 
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO (HEADER) -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo-text-container">
                <span class="logo-top">CrosVerso</span>
                <div class="logo-bottom">
                    <span class="logo-rpg">RPG</span>
                    <!-- Certifique-se que a imagem mascaras-icon.png está na pasta -->
                    <img src="mascaras-icon.png" alt="" class="mask-icon" onerror="this.style.display='none'">
                </div>
            </div>
            <div class="vertical-divider"></div>
        </div>

        <div class="header-right">
            <!-- Botão de Pesquisa -->
            <button class="icon-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <!-- Botão de Menu -->
            <button class="icon-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO DA PÁGINA (Totalmente Vazio) -->
    <div class="container main-content">
        
    </div>

</body>
</html>
